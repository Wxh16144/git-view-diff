name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name=git-view-diff-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/git-view-diff* "$name"/
          rm -f "$name"/*.d "$name"/*.pdb
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          body: |
            ## Install

            Download the archive for your platform, extract it, and put `git-view-diff` somewhere on your `PATH`. Git picks it up as the `git view-diff` subcommand.

            ```sh
            # e.g. macOS (Apple Silicon)
            tar xzf git-view-diff-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            mv git-view-diff-${{ github.ref_name }}-aarch64-apple-darwin/git-view-diff /usr/local/bin/
            xattr -d com.apple.quarantine /usr/local/bin/git-view-diff  # macOS only, if blocked by Gatekeeper
            ```

            ## Usage

            ```sh
            git view-diff                          # working tree changes -> patch-view.html
            git view-diff --cached                 # any `git diff` args are passed through
            git view-diff main...HEAD -- src
            git view-diff -o review.html --open    # custom output file, then open in browser
            git show HEAD | git view-diff          # read a diff/patch from stdin
            git view-diff -h
            ```
