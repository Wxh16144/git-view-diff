name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name=git-view-diff-${{ matrix.target }}
          cd target/${{ matrix.target }}/release
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "$GITHUB_WORKSPACE/$name.zip" git-view-diff.exe
          else
            tar czf "$GITHUB_WORKSPACE/$name.tar.gz" git-view-diff
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          body: |
            ## Install

            Put `git-view-diff` on your `PATH`, and Git picks it up as the `git view-diff` subcommand.

            ```sh
            # aarch64-apple-darwin | x86_64-apple-darwin | x86_64-unknown-linux-gnu | aarch64-unknown-linux-gnu
            TARGET=aarch64-apple-darwin
            mkdir -p ~/.local/bin   # make sure it is on your PATH
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/git-view-diff-$TARGET.tar.gz | tar xz -C ~/.local/bin
            git view-diff -V
            ```

            Windows: extract `git-view-diff.exe` from `git-view-diff-x86_64-pc-windows-msvc.zip` into a directory on your `PATH`.

            > [!NOTE]
            > On macOS, a binary downloaded **via a browser** is quarantined by Gatekeeper and gets killed (`died of signal 9`) or moved to Trash on first run. Use the `curl` command above, or clear the flag before running it:
            > `xattr -d com.apple.quarantine ~/.local/bin/git-view-diff`

            ## Usage

            ```sh
            git view-diff                          # working tree changes -> $TMPDIR/git-view-diff.html
            git view-diff --cached                 # any `git diff` args are passed through
            git view-diff main...HEAD -- src
            git view-diff -o review.html --open    # custom output file, then open in browser
            git show HEAD | git view-diff          # read a diff/patch from stdin
            git view-diff -h
            ```
